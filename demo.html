    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --fondo: #0C1310;
      --superficie: rgba(21,32,27,0.72);
      --superficie-solida: #131E1A;
      --borde: rgba(236,242,239,0.09);
      --borde-fuerte: rgba(236,242,239,0.16);
      --texto: #ECF2EF;
      --gris: #8FA69D;
      --menta: #4FD1A5;
      --menta-viva: #72E3BE;
      --menta-tenue: rgba(79,209,165,0.14);
      --lila: #A78BFA;
      --ambar: #E8B44C;
      --coral: #F0745C;
      --radio: 20px;
      --sombra: 0 1px 0 rgba(255,255,255,0.04) inset, 0 16px 40px rgba(0,0,0,0.35);
      --grad-acento: linear-gradient(120deg, #4FD1A5, #A78BFA);
      --grad-boton: linear-gradient(120deg, #3EC59A, #35A986);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); }
    .shell, .login-fondo {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--texto);
      background:
        radial-gradient(1000px 560px at 88% -12%, rgba(79,209,165,0.13), transparent 55%),
        radial-gradient(820px 560px at -8% 108%, rgba(167,139,250,0.11), transparent 55%),
        radial-gradient(620px 380px at 55% 118%, rgba(79,209,165,0.06), transparent 60%),
        var(--fondo);
      background-attachment: fixed;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .kpi-num, .hero-saludo, .marca-nombre, .monograma, .login-marca-nombre,
    .tarjeta-cliente-peso, .plan-num, .plan-valor {
      font-family: 'Bricolage Grotesque', 'Inter', sans-serif;
    }
    h1 { font-size: 27px; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
    h2 { font-size: 16.5px; margin: 0; font-weight: 700; }
    button { font-family: inherit; cursor: pointer; }
    ::selection { background: rgba(79,209,165,0.35); }

    /* ---- Layout ---- */
    .shell { display: flex; }
    .lateral {
      width: 232px; min-height: 100vh; background: rgba(14,22,19,0.65);
      backdrop-filter: blur(18px); border-right: 1px solid var(--borde);
      display: flex; flex-direction: column; padding: 24px 14px; position: sticky; top: 0; height: 100vh;
    }
    .marca-lateral { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-left: 6px; }
    .monograma {
      width: 44px; height: 44px; border-radius: 15px; background: var(--grad-acento);
      color: #0C1310; font-size: 23px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(79,209,165,0.35);
    }
    .marca-nombre { color: var(--texto); font-weight: 800; letter-spacing: 0.15em; font-size: 15px; }
    .marca-sub { color: var(--gris); font-size: 11px; letter-spacing: 0.08em; }
    .nav-item {
      display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
      background: none; border: 1px solid transparent; color: var(--gris); padding: 12px 13px;
      border-radius: 14px; font-size: 14.5px; font-weight: 600; margin-bottom: 4px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .nav-item:hover { background: rgba(236,242,239,0.05); color: var(--texto); }
    .nav-activo {
      background: var(--menta-tenue); color: var(--menta-viva);
      border-color: rgba(79,209,165,0.25);
    }
    .nav-icono { width: 20px; text-align: center; }
    .lateral-pie { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--borde); }
    .lateral-pie .btn-enlace { color: var(--gris); }
    .contenido { flex: 1; padding: 28px 38px 100px; max-width: 1200px; animation: aparecer 0.4s ease; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .banda-proto {
      background: rgba(232,180,76,0.10); color: var(--ambar); font-size: 12.5px;
      padding: 6px 15px; border-radius: 999px; margin-bottom: 22px; display: inline-block;
      border: 1px solid rgba(232,180,76,0.28);
    }
    .nav-movil { display: none; }

    /* ---- Hero ---- */
    .hero {
      background:
        radial-gradient(340px 200px at 90% 0%, rgba(167,139,250,0.22), transparent 60%),
        radial-gradient(420px 260px at 8% 110%, rgba(79,209,165,0.20), transparent 60%),
        var(--superficie-solida);
      border: 1px solid var(--borde-fuerte);
      color: var(--texto); border-radius: 24px; padding: 28px 30px;
      display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
      margin-bottom: 22px; box-shadow: var(--sombra);
    }
    .hero-saludo {
      font-size: 32px; font-weight: 800; letter-spacing: -0.02em;
      background: var(--grad-acento); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero-fecha { color: var(--gris); font-size: 14px; margin-top: 5px; text-transform: capitalize; }
    .btn-claro { background: var(--texto); color: #0C1310; border: none; font-weight: 700; }
    .btn-claro:hover { background: #fff; }

    /* ---- Componentes ---- */
    .tarjeta {
      background: var(--superficie); backdrop-filter: blur(14px);
      border: 1px solid var(--borde); border-radius: var(--radio);
      padding: 20px 22px; box-shadow: var(--sombra); text-align: left; color: var(--texto);
    }
    .tarjeta-titulo { margin-bottom: 12px; }
    .tarjeta-cab-accion { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .cab-pagina { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .txt-suave { color: var(--gris); font-size: 13.5px; }
    .chip { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .avatar {
      border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%;
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; flex-shrink: 0; box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 -6px 12px rgba(0,0,0,0.22);
    }

    .btn { border-radius: 13px; padding: 10px 17px; font-size: 14px; font-weight: 600; border: 1px solid transparent; transition: filter 0.15s, border-color 0.15s, transform 0.1s, background 0.15s; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primario { background: var(--grad-boton); color: #06110D; font-weight: 700; box-shadow: 0 6px 20px rgba(79,209,165,0.30); }
    .btn-primario:hover:not(:disabled) { filter: brightness(1.1); }
    .btn-secundario { background: rgba(236,242,239,0.05); border-color: var(--borde-fuerte); color: var(--texto); }
    .btn-secundario:hover:not(:disabled) { border-color: var(--menta); color: var(--menta-viva); }
    .btn-ancho { width: 100%; }
    .btn-enlace { background: none; border: none; color: var(--menta-viva); font-size: 13.5px; font-weight: 600; padding: 4px 0; }
    .btn-peligro { color: var(--coral); }
    .btn:focus-visible, .btn-enlace:focus-visible, .input:focus-visible, .tab:focus-visible, .foto:focus-visible {
      outline: 2px solid var(--menta); outline-offset: 2px;
    }

    .input {
      width: 100%; padding: 10px 13px; border: 1.5px solid var(--borde-fuerte); border-radius: 13px;
      font-size: 14px; font-family: inherit; background: rgba(12,19,16,0.6); color: var(--texto);
      transition: border-color 0.15s, box-shadow 0.15s;
      color-scheme: dark;
    }
    .input::placeholder { color: rgba(143,166,157,0.7); }
    .input:focus { border-color: var(--menta); outline: none; box-shadow: 0 0 0 3px rgba(79,209,165,0.16); }
    select.input option { background: var(--superficie-solida); }
    .campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; font-size: 13.5px; }
    .campo-etiqueta { font-weight: 600; color: var(--texto); }
    .campo-etiqueta em { font-style: normal; font-weight: 400; color: var(--gris); font-size: 12px; }
    .campo-error { color: var(--coral); font-size: 12.5px; }
    .alerta-error { background: rgba(240,116,92,0.12); border: 1px solid rgba(240,116,92,0.3); color: var(--coral); padding: 9px 13px; border-radius: 13px; font-size: 13.5px; margin-bottom: 12px; }
    .seccion-form { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--menta); font-weight: 700; margin: 10px 0 10px; }
    .rejilla-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .rejilla-medidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }

    /* ---- KPIs y rejillas ---- */
    .rejilla-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
    .kpi {
      background: var(--superficie); backdrop-filter: blur(14px);
      border: 1px solid var(--borde); border-radius: var(--radio);
      padding: 18px; text-align: left; box-shadow: var(--sombra); position: relative; overflow: hidden;
      color: var(--texto);
    }
    .kpi::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3.5px; border-radius: 4px; background: var(--grad-acento); }
    .kpi-num { font-size: 33px; font-weight: 800; line-height: 1.05; }
    .kpi-etq { font-size: 13px; color: var(--gris); margin-top: 5px; font-weight: 500; }
    .kpi-alerta::before { background: var(--ambar); }
    .kpi-alerta .kpi-num { color: var(--ambar); }
    button.kpi { cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    button.kpi:hover { transform: translateY(-2px); border-color: rgba(79,209,165,0.4); }
    .rejilla-2col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
    .rejilla-clientes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

    .tarjeta-cliente { cursor: pointer; transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s; }
    .tarjeta-cliente:hover { border-color: rgba(79,209,165,0.45); transform: translateY(-3px); box-shadow: 0 18px 44px rgba(0,0,0,0.45); }
    .tarjeta-cliente-cab { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; }
    .tarjeta-cliente-pie { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px dashed var(--borde-fuerte); padding-top: 12px; }
    .tarjeta-cliente-peso { font-size: 19px; font-weight: 700; }
    .sparkline { color: var(--menta); filter: drop-shadow(0 0 6px rgba(79,209,165,0.5)); }
    .fila-cliente { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 13px; cursor: pointer; transition: background 0.12s; }
